# Render blueprint para el BACKEND de Mnemo (FastAPI).
# Despliega desde el Dockerfile. Render → "New +" → "Blueprint" → apunta a este repo.
# Los valores `sync: false` se rellenan a mano en el dashboard de Render (secretos/propios).
#
# ⚠️ RAM: el embedder local (sentence-transformers → torch) necesita ~1–1.5 GB en memoria.
#    El plan free/starter de 512 MB NO lo aguanta → usa un plan con ≥1 GB, o despliega en
#    un host con más memoria (ver docs/deploy/produccion.md → alternativas).
services:
  - type: web
    name: mnemo-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v2/health
    plan: standard            # ≥1 GB RAM (free/starter de 512 MB no cargan torch)
    autoDeploy: true
    envVars:
      # --- Base de datos + Auth (de tu proyecto Supabase de producción) ---
      - key: DATABASE_URL
        sync: false           # postgresql://...  (cadena del Session pooler de Supabase)
      - key: SUPABASE_URL
        sync: false           # https://<proyecto>.supabase.co
      - key: SUPABASE_JWKS_URL
        sync: false           # https://<proyecto>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # --- LLM: Groq con openai/gpt-oss-120b (API compatible con OpenAI; el de la demo) ---
      # Clave en https://console.groq.com/keys. Sin LLM, las funciones de IA degradan.
      - key: LLM_PROVIDER
        value: openai
      - key: ALLOW_EXTERNAL_LLM
        value: "true"
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false                    # tu API key de Groq (console.groq.com/keys)
      # Alternativa Google Gemini (mismo LLM_PROVIDER=openai):
      #   OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      #   LLM_MODEL=gemini-2.5-flash
      #   OPENAI_API_KEY=<key de aistudio.google.com/apikey>
      # --- Firma de actas Ed25519 (SIN esto el certificado está APAGADO: pubkey → 503) ---
      # Generación y formato: docs/deploy/produccion.md → "Claves de firma del acta".
      - key: MNEMO_SIGNING_PRIVATE_KEY
        sync: false                    # PEM completo (BEGIN/END PRIVATE KEY)
      - key: MNEMO_SIGNING_PUBLIC_KEY
        sync: false                    # PEM completo (BEGIN/END PUBLIC KEY) — publicable
      # --- Webhook de CI (ingesta automática; sin esto /v2/ci/webhook devuelve 401/503) ---
      - key: CI_WEBHOOK_SECRET
        sync: false                    # secreto compartido HMAC-SHA256
      - key: CI_SERVICE_USER_ID
        sync: false                    # UUID del usuario de servicio (miembro del org)
      - key: CI_SERVICE_ORG_ID
        sync: false                    # opcional: único org aceptado por el webhook
      # --- Cifrado de credenciales Jira/Xray por-org (obligatoria si se usa Jira) ---
      - key: MNEMO_SECRET_KEY
        sync: false                    # clave Fernet (ver .env.example para generarla)
