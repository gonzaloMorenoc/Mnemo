name: Backend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "db/**"
      - "asgi.py"
      - "Dockerfile"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, master]
    # Un push a main con CI verde despliega el backend (deploy-backend.yml): todo lo que
    # cambia el backend o el esquema tiene que pasar por aquí, también db/ y asgi.py.
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "db/**"
      - "asgi.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Auditoría de dependencias (pip-audit, no bloqueante)
        # Audita el entorno ya instalado (dependencias transitivas incluidas). NO bloquea
        # todavía: puede haber avisos sin versión arreglada. El informe queda en el
        # resumen del job; cuando esté limpio, quitar continue-on-error.
        continue-on-error: true
        run: |
          pip install pip-audit
          set -o pipefail
          pip-audit --progress-spinner off --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run unit tests
        run: python -m pytest -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=67 -q
      - name: AI eval (golden de triaje)
        run: python scripts/eval_ai.py --min-accuracy 0.8

  db:
    name: Migraciones y BD (Postgres de prueba)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un Postgres con pgvector, vacío: aplica TODAS las migraciones desde cero (dos
    # veces: la segunda no debe aplicar nada salvo la 999) y corre los tests marcados
    # `testdb`. Si el esquema no se puede construir, el CI falla y no se despliega.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MNEMO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Esquema mínimo de Supabase
        run: psql "$MNEMO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/bootstrap_test_db.sql
      - name: Migraciones desde cero (y de nuevo, idempotente)
        run: |
          set -o pipefail
          DATABASE_URL="$MNEMO_TEST_DATABASE_URL" python scripts/migrate.py
          DATABASE_URL="$MNEMO_TEST_DATABASE_URL" python scripts/migrate.py 2>&1 | tee second.log
          grep -q "listo: 0 pendientes aplicadas" second.log
      - name: Tests contra la BD de prueba
        run: python -m pytest -m testdb -q
