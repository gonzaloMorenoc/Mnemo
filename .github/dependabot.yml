# Dependabot NO abre PRs de versión (open-pull-requests-limit: 0): cada PR dispara CI y
# despliegues, y la cuota de Vercel es limitada. Las PRs de seguridad dependen del ajuste
# del repo «Dependabot security updates» (hoy desactivado). pip-audit en el CI vigila las
# dependencias Python en cada PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
