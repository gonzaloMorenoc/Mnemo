# Solo actualizaciones de SEGURIDAD (Dependabot las abre en cuanto hay un aviso).
# Las de versión están desactivadas (open-pull-requests-limit: 0): cada PR dispara CI
# y despliegues, y la cuota de Vercel es limitada. pip-audit en el CI vigila además las
# dependencias Python en cada PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
